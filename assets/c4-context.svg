<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="mcl-fovea-keeper system context">
<title>mcl-fovea-keeper system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="640"/>
<rect class="b-per" x="40" y="30" width="270" height="96" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Keeper operator</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">Runs the systemd units on their</text>
<text class="t-desc" x="56" y="116">machine; holds the deploy key</text>
<rect class="b-ext" x="365" y="30" width="270" height="96" rx="10"/>
<text class="t-name" x="381" y="58">ghcr.io</text>
<text class="t-type" x="381" y="76">[External: GitHub Actions, registry]</text>
<text class="t-desc" x="381" y="100">CI builds, signs and attests the</text>
<text class="t-desc" x="381" y="116">image; the machine runs a digest</text>
<rect class="b-per" x="690" y="30" width="270" height="96" rx="10"/>
<circle class="head" cx="716" cy="54" r="9"/>
<text class="t-name" x="734" y="58">Anyone who checks</text>
<text class="t-type" x="734" y="76">[Person]</text>
<text class="t-desc" x="706" y="100">Clones the records and runs</text>
<text class="t-desc" x="706" y="116">fovea verify --chain on them</text>
<rect class="b-ext" x="40" y="210" width="270" height="120" rx="10"/>
<text class="t-name" x="56" y="238">mcl-fovea-assessments</text>
<text class="t-type" x="56" y="256">[External: public git]</text>
<text class="t-desc" x="56" y="280">The assessments each record</text>
<text class="t-desc" x="56" y="296">names; cloned fresh every run</text>
<rect class="b-sys" x="365" y="210" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="238">mcl-fovea-keeper</text>
<text class="t-type" x="381" y="256">[Go program in a signed OCI image]</text>
<text class="t-desc" x="381" y="280">One run every 15 minutes: fetches</text>
<text class="t-desc" x="381" y="296">each slot, keeps what fovea verify</text>
<text class="t-desc" x="381" y="312">accepts, logs every fetch</text>
<rect class="b-ext" x="690" y="210" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="238">mcl-fovea-records</text>
<text class="t-type" x="706" y="256">[External: public git]</text>
<text class="t-desc" x="706" y="280">keeper.json (the policy), kept</text>
<text class="t-desc" x="706" y="296">records, endorsements, fetch logs,</text>
<text class="t-desc" x="706" y="312">each slot's chain verdict</text>
<rect class="b-ext" x="40" y="420" width="270" height="120" rx="10"/>
<text class="t-name" x="56" y="448">mcl-fovea observer</text>
<text class="t-type" x="56" y="466">[Software system, ours]</text>
<text class="t-desc" x="56" y="490">Signs one 0x23 verdict per claim</text>
<text class="t-desc" x="56" y="506">and station, chains it, puts it in</text>
<text class="t-desc" x="56" y="522">the mesh DHT</text>
<rect class="b-mac" x="365" y="420" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="448">Macula stations, mesh DHT</text>
<text class="t-type" x="381" y="466">[Macula infrastructure]</text>
<text class="t-desc" x="381" y="490">Hold the latest verdict per slot</text>
<text class="t-desc" x="381" y="506">and the realm's endorsement of</text>
<text class="t-desc" x="381" y="522">the observer</text>
<path class="edge" d="M175 126V166H420V210" marker-end="url(#a)"/>
<text class="t-rel" x="183" y="158">runs every 15 minutes (podman)</text>
<path class="edge" d="M560 126V210" marker-end="url(#a)"/>
<text class="t-rel" x="568" y="186">image, by digest</text>
<path class="edge" d="M825 126V210" marker-end="url(#a)"/>
<text class="t-rel" x="833" y="162">clones; verifies</text>
<path class="edge" d="M365 270H310" marker-end="url(#a)"/>
<text class="t-rel" x="337" y="260" text-anchor="middle">clones</text>
<text class="t-rel" x="337" y="290" text-anchor="middle">HTTPS</text>
<path class="edge" d="M635 270H690" marker-end="url(#a)"/>
<text class="t-rel" x="662" y="260" text-anchor="middle">pulls,</text>
<text class="t-rel" x="662" y="290" text-anchor="middle">pushes</text>
<text class="t-rel" x="662" y="304" text-anchor="middle">SSH</text>
<path class="edge" d="M500 330V420" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="364">QUIC to the first station</text>
<text class="t-rel" x="508" y="380">that proves its node id;</text>
<text class="t-rel" x="508" y="396">finds records</text>
<path class="edge" d="M310 480H365" marker-end="url(#a)"/>
<text class="t-rel" x="337" y="470" text-anchor="middle">puts</text>
<rect class="b-sys" x="24" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="602">In scope</text>
<rect class="b-per" x="110.8" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="602">Person</text>
<rect class="b-mac" x="184.39999999999998" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="602">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="602">External system</text>
<rect class="b-cmp" x="490.0" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="602">Container or component</text>
<rect class="b-later" x="669.2" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="699.2" y="602">Planned, not built</text>
</svg>
