# Build ghcr.io/macula-io/mcl-fovea-keeper, then sign it and attest its SBOM and
# provenance (macula-ci-images' attest-image.yml), so the keeper's machine runs
# a keeper our CI signed.
#
# The machine runs the image BY DIGEST from its own keeper.env: a build here
# changes nothing until that digest is moved. The tags are for readers:
#   latest, <semver> (from a v* tag), git-<full commit sha> (never moved)

name: build-push

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', 'systemd/**', 'assets/**', 'architecture/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # REFUSED BEFORE ANYTHING IS PUSHED: a v* tag off the default branch (or off its
  # line's release-<major>.<minor> branch), or whose version is not the one this
  # repository publishes, stops here, so a refused tag leaves no image on the
  # registry. Any other ref passes. attest-image checks the same again before it
  # signs. Pinned by full commit sha, as the attest call is.
  guard:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe
    # Go: the tag is the version (go.mod names none), declared rather than defaulted.
    with:
      versions: none

  # NO IMAGE WHILE THE CODE FAILS ITS CHECKS (mcl-om#34). The keeper has no test
  # files yet, so `go test' compiles every package and runs nothing; with
  # `go vet' that is the whole gate today, and a test added later joins it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # THE STRUCTURAL FLOOR (macula-io/macula-codebase-checks#9): deep nesting and
  # tangled functions fail the build. The caps are spelled out in .golangci.yml,
  # never taken from a tool default, and there is no baseline to fall back on.
  lint:
    name: structural lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.15.0
          args: --timeout 10m

  build:
    needs: [guard, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: tags
        run: |
          image=ghcr.io/macula-io/mcl-fovea-keeper
          {
            echo "tags<<EOF"
            echo "$image:git-${GITHUB_SHA}"
            case "$GITHUB_REF" in
              refs/tags/v*)    echo "$image:${GITHUB_REF#refs/tags/v}" ;;
              refs/heads/main) echo "$image:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            REVISION=${{ github.sha }}

  attest:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe
    with:
      image: ghcr.io/macula-io/mcl-fovea-keeper
      digest: ${{ needs.build.outputs.digest }}
      # Go: the tag is the version (go.mod names none); the tag must still be on main.
      versions: none
